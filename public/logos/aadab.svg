<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="aadabGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF0B3" />
      <stop offset="35%" stopColor="#F5D77B" />
      <stop offset="70%" stopColor="#C99A32" />
      <stop offset="100%" stopColor="#986719" />
    </linearGradient>
    <filter id="aadabGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Left Press Crest / Charminar / Newspaper motif -->
  <g filter="url(#aadabGlow)" transform="translate(14, 14)">
    <rect x="0" y="2" width="44" height="46" rx="6" fill="#08101E" stroke="url(#aadabGold)" stroke-width="2" />
    <!-- Newspaper lines & quill -->
    <line x1="8" y1="12" x2="36" y2="12" stroke="url(#aadabGold)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="19" x2="36" y2="19" stroke="url(#aadabGold)" stroke-width="1.8" stroke-linecap="round" />
    <line x1="8" y1="26" x2="28" y2="26" stroke="url(#aadabGold)" stroke-width="1.8" stroke-linecap="round" />
    <path d="M10 40 L22 34 L34 40 L22 37 Z" fill="url(#aadabGold)" />
  </g>

  <!-- "AADAB" masthead in bold serif -->
  <text x="68" y="44" font-family="'Cinzel', 'Times New Roman', serif" font-weight="900" font-size="33" fill="#FFFFFF" letter-spacing="2">AADAB</text>

  <!-- "HYDERABAD" subtitle in tracked gold -->
  <line x1="68" y1="51" x2="225" y2="51" stroke="url(#aadabGold)" stroke-width="1.2" opacity="0.8" />
  <text x="68" y="64" font-family="'Cinzel', 'Georgia', serif" font-weight="700" font-size="10.5" fill="url(#aadabGold)" letter-spacing="5.5">HYDERABAD</text>
  <text x="218" y="64" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#D5D9E2" letter-spacing="1">DAILY</text>
</svg>

