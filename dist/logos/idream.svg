<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="idreamGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF0B3" />
      <stop offset="35%" stopColor="#F5D77B" />
      <stop offset="70%" stopColor="#C99A32" />
      <stop offset="100%" stopColor="#986719" />
    </linearGradient>
    <linearGradient id="idreamRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF416C" />
      <stop offset="100%" stopColor="#FF4B2B" />
    </linearGradient>
    <filter id="idreamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#idreamGlow)">
    <!-- Play circle insignia on left -->
    <circle cx="36" cy="38" r="22" fill="#0A1424" stroke="url(#idreamGold)" stroke-width="2.5" />
    <circle cx="36" cy="38" r="17" fill="url(#idreamRed)" opacity="0.25" />
    <!-- Golden Film / Play triangle -->
    <polygon points="32,28 45,38 32,48" fill="url(#idreamGold)" />
  </g>

  <!-- "i" in distinctive stylized italic red/gold -->
  <text x="68" y="46" font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="40" font-style="italic" fill="url(#idreamRed)">i</text>

  <!-- "Dream" in clean bold white modern font -->
  <text x="84" y="46" font-family="'Cinzel', 'Helvetica Neue', 'Arial', sans-serif" font-weight="800" font-size="30" fill="#FFFFFF" letter-spacing="1">Dream</text>

  <!-- "MEDIA" in tracking champagne gold -->
  <rect x="85" y="53" width="98" height="13" rx="3" fill="#0B1930" stroke="url(#idreamGold)" stroke-width="1" />
  <text x="134" y="63" font-family="'Inter', sans-serif" font-weight="800" font-size="8.5" fill="url(#idreamGold)" text-anchor="middle" letter-spacing="4">MEDIA</text>
</svg>

