<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bigFmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF0B3" />
      <stop offset="35%" stopColor="#F5D77B" />
      <stop offset="70%" stopColor="#C99A32" />
      <stop offset="100%" stopColor="#986719" />
    </linearGradient>
    <linearGradient id="bigFmBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0072FF" />
      <stop offset="100%" stopColor="#00C6FF" />
    </linearGradient>
    <filter id="bigFmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Left: 92.7 frequency roundel badge with radio waves -->
  <g filter="url(#bigFmGlow)" transform="translate(8, 14)">
    <circle cx="26" cy="26" r="24" fill="#071529" stroke="url(#bigFmGold)" stroke-width="2.5" />
    <text x="26" y="24" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="14.5" fill="url(#bigFmGold)" text-anchor="middle">92.7</text>
    <text x="26" y="37" font-family="'Inter', sans-serif" font-weight="900" font-size="8.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">RADIO</text>
    
    <!-- Sound waves emitting -->
    <path d="M46 16 A 15 15 0 0 1 46 36" stroke="url(#bigFmGold)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M51 12 A 20 20 0 0 1 51 40" stroke="url(#bigFmGold)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
  </g>

  <!-- "BIG" text in bold italic -->
  <text x="68" y="47" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="34" font-style="italic" fill="#FFFFFF" letter-spacing="1">BIG</text>

  <!-- "FM" in gold badge -->
  <g transform="translate(138, 18)">
    <rect x="0" y="0" width="46" height="33" rx="6" fill="#0B1A30" stroke="url(#bigFmGold)" stroke-width="2" />
    <text x="23" y="24" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="22" fill="url(#bigFmGold)" text-anchor="middle" letter-spacing="1">FM</text>
  </g>

  <!-- Tagline / Station Frequency -->
  <text x="68" y="65" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="url(#bigFmGold)" letter-spacing="3.5">92.7 FM · LIFE BANAO</text>
</svg>

