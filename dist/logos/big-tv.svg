<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bigTvGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF0B3" />
      <stop offset="35%" stopColor="#F5D77B" />
      <stop offset="70%" stopColor="#C99A32" />
      <stop offset="100%" stopColor="#986719" />
    </linearGradient>
    <linearGradient id="bigTvRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#E52D27" />
      <stop offset="100%" stopColor="#B31217" />
    </linearGradient>
    <filter id="bigTvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- TV Screen frame icon on left -->
  <g filter="url(#bigTvGlow)">
    <rect x="12" y="16" width="48" height="38" rx="8" fill="#08101E" stroke="url(#bigTvGold)" stroke-width="2.5" />
    <!-- Antennas -->
    <path d="M26 8 L36 16 L46 8" stroke="url(#bigTvGold)" stroke-width="2.2" stroke-linecap="round" />
    <!-- Screen play triangle -->
    <polygon points="31,27 43,35 31,43" fill="url(#bigTvGold)" />
    <!-- Stand -->
    <path d="M30 54 L30 58 M24 58 L48 58" stroke="url(#bigTvGold)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- "BIG" text in bold italic -->
  <text x="68" y="47" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="34" font-style="italic" fill="#FFFFFF" letter-spacing="1">BIG</text>
  
  <!-- "TV" in bold gold/red box -->
  <g transform="translate(138, 18)">
    <rect x="0" y="0" width="46" height="33" rx="6" fill="url(#bigTvRed)" stroke="url(#bigTvGold)" stroke-width="1.8" />
    <text x="23" y="24" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TV</text>
  </g>

  <!-- Tagline -->
  <text x="68" y="65" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="url(#bigTvGold)" letter-spacing="3.5">TELUGU NEWS 24x7</text>
</svg>

